<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dukan Khata - Download</title>
<style>
body{font-family:sans-serif;text-align:center;padding:40px 20px;background:#f4f7f6}
h1{color:#047a68}
a.btn{display:inline-block;margin-top:20px;padding:16px 32px;background:#047a68;color:#fff;border-radius:30px;font-size:20px;text-decoration:none}
a.btn.off{background:#999;pointer-events:none}
#v{color:#555;margin-top:12px}
</style>
</head>
<body>
<h1>Dukan Khata</h1>
<p>اپنی دکان کا حساب آسان بنائیں</p>
<a id="dl" class="btn off" href="#">Loading...</a>
<div id="v"></div>
<script>
fetch("https://api.github.com/repos/Velloracut/Dukan-khata-releases/releases/latest")
.then(r=>r.json())
.then(d=>{
  var a=(d.assets||[]).find(x=>x.name.endsWith(".apk"));
  var b=document.getElementById("dl");
  if(a){
    b.href=a.browser_download_url;
    b.textContent="Download App (APK)";
    b.classList.remove("off");
    document.getElementById("v").textContent="Version "+d.tag_name;
  } else { b.textContent="APK not found"; }
})
.catch(()=>{document.getElementById("dl").textContent="Error, try again";});
</script>
</body>
</html>
